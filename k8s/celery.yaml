apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: watchlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
        - name: celery
          image: docker.io/library/watchlist-backend:latest
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - app.worker.celery_app:celery_app
            - worker
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: watchlist-config
            - secretRef:
                name: watchlist-secret