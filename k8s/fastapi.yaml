apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: watchlist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: docker.io/library/watchlist-backend:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: watchlist-config
            - secretRef:
                name: watchlist-secret
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: watchlist
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000